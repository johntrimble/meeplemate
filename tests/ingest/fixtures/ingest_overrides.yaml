# A complete-but-minimal config whose ingest values are all deliberately
# different from the defaults, so a test can tell an applied override from a
# default that happens to match.
model_name: test-model
embedding:
  model: BAAI/bge-small-en-v1.5
  api_key: dummy-key
chat:
  models:
  - model_name: test-model
    endpoint_type: openai
    endpoint: http://localhost:9/v1

ingest:
  chunk_size: 321
  chunk_overlap: 21
  child_chunk_size: 87
  child_chunk_overlap: 7
  max_ocr_workers: 9
  render:
    dpi: 150
    max_image_size: 900
    pdf_page_chunk: 3
  ocr:
    base_url: "http://ocr.test/v1"
    model: "test/other-ocr"
    temperature: 0.4
    max_tokens: 512
    extra_body:
      vllm_xargs:
        ngram_size: 11
  page_number_ocr:
    base_url: "http://pagenum.test/v1"
    model: "test/other-pagenum"
