[project]
name = "meeplemate"
version = "0.1.0"
description = "Board Game AI Assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib",
    "tqdm",
    "numpy",
    "langchain>=1.0,<2.0",
    "langchain-community",
    "langchain-openai",
    "langchain-classic",
    "langchain-postgres",
    "transformers",
    "tokenizers>=0.19",
    "chainlit",
    "structlog",
    "sentencepiece",
    "langgraph>=1.0,<2.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "pyyaml",
    "clingo",
    "CyDifflib",
    "asyncpg",
    "sqlalchemy[asyncio]",
    "alembic",
    "firebase-admin",
    "fastembed",
    "pdf2image",
#    "glmocr @ git+https://github.com/zai-org/GLM-OCR.git@main"
]

[project.urls]
Repository = "https://github.com/johntrimble/meeplemate"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.8.6",
    "mypy>=1.18.2",
    "ipython",
    "pytest-unordered",
    "deepeval",
    "plotly",
    "nbformat>=4.2.0",
    "jupyter",
    "ipykernel",
    "pandas",
]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:builtin type Swig:DeprecationWarning",
]

[build-system]
requires = ["uv_build>=0.8.24,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.uv.sources]

[project.scripts]
meeplemate-cli = "meeplemate.cli:cli"
mm-eval = "meeplemate.eval.__main__:cli"
mm-ingest = "meeplemate.ingest.__main__:cli"
