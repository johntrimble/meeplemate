# Pinned so the stack/volume identity is stable regardless of what the repo
# directory is named or how compose is invoked (VS Code Dev Containers vs. a
# plain `docker compose` from the CLI).
name: meeplemate_devcontainer

# Standard options we will include in our services.
x-base-service: &base-service
  # Load the app's own .env (secrets/config, lives at the project root) first,
  # then this directory's .env (devcontainer-only settings) so it can override.
  env_file:
  - path: ../.env
    required: false
  - path: .env
    required: false

  # Make sure the container runs as the same user as the host to avoid
  # permission issues with mounted volumes.
  user: "${MY_UID}:${MY_GID}"

  # Docker allocates 64MB of shared memory by default. This is sometimes 
  # insufficient. Rather than mock around with settings here, we just set the
  # IPC mode to use the host. Note that this is not recommended for production
  # environments due to security concerns, but it is useful for development.
  ipc: host

services:
  dev:
    # The main development environment container.
    # Inherits common settings from the base service anchor above.
    <<: *base-service
    depends_on:
      vllm:
        condition: service_started
      firebase-emulator:
        condition: service_started
    build:
      # Build context is the pytorch Dockerfile directory
      context: ./services/dev/
      additional_contexts:
        # Allows referencing the project root in the Dockerfile
        workspace: ..
      args:
        # Ensure the container user matches the host user for correct file permissions.
        # These are set in the .env file, which is initialized by script/bootstrap.
        UID: ${MY_UID}
        GID: ${MY_GID}

    # The base anchor's env_file list is replaced, not merged, so repeat it.
    # Hindsight is configured entirely through the environment and writes no
    # config file, so its endpoint and token reach the container from
    # ../.env.hindsight (see .env.hindsight.example). Only this service loads it.
    env_file:
    - path: ../.env
      required: false
    - path: .env
      required: false
    - path: ../.env.hindsight
      required: false

    ports:
    - 8000:8000 # Chainlit
    - 5173:5173 # vite

    # Mount the project root and data directory into the container.
    # This allows code and data changes on the host to be reflected in the container.
    volumes:
    # Mount the project root under /workspaces/meeplemate (rather than
    # directly at /workspace), leaving room to mount additional directories
    # under /workspaces/ later without remounting this one.
    - ..:/workspaces/meeplemate:cached
    # Persist data across container restarts (models, cache, etc)
    - ../data:/data:cached
    # Claude CLI data
    - claude_data:/home/vscode/.claude:cached
    # Hindsight runtime staged by .devcontainer/script/hindsight-setup
    - hindsight_data:/home/vscode/.hindsight
    # Codex CLI data
    - codex_data:/home/vscode/.codex
    # User-level agent skills (~/.agents)
    - agents_data:/home/vscode/.agents

    environment:
    - FASTEMBED_CACHE_PATH=/workspaces/meeplemate/data/fastembed_cache
    - HINDSIGHT_SERVER_MODE=self-hosted
    # One shared bank for this project. Not a secret, and set here rather than
    # in .env.hindsight so it wins over any bank id that file carries.
    - HINDSIGHT_BANK_ID=meeplemate
    # The placeholder resolves per repository at hook time.
    - HINDSIGHT_RETAIN_TAGS=project:{gitProject}
    - CLAUDE_CONFIG_DIR=/home/vscode/.claude

    # Set the working directory to where the project folder is mounted.
    working_dir: /workspaces/meeplemate

    # Keep the container running (useful for VS Code dev containers, debugging, etc).
    command: tail -f /dev/null

    # # Enable GPU access for PyTorch (NVIDIA only).
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #       - driver: nvidia
    #         # If you want to expose all GPUs, you can comment out the device_ids line.
    #         # Otherwise, specify the GPU IDs you want to use.
    #         # device_ids: ['0', '1']
    #         device_ids: ['0']
    #         capabilities: [gpu]

  vllm:
    image: vllm/vllm-openai:v0.13.0
    ipc: host

    environment:
      GPU_MEMORY_UTILIZATION: 0.95
      VLLM_LOG_LEVEL: "INFO"
      # VLLM_NVFP4_GEMM_BACKEND: "cutlass"

    # Qwen 3 32B
    command:
      - --model
      # - RedHatAI/Qwen3-32B-NVFP4A16
      # - RedHatAI/Qwen3-32B-NVFP4
      - NVFP4/Qwen3-30B-A3B-Instruct-2507-FP4
      # - NVFP4/Qwen3-Coder-30B-A3B-Instruct-FP4
      - "--served-model-name"
      # - "Qwen/Qwen3-Coder-30B-A3B-Instruct"
      # - "Qwen/Qwen3-32B"
      - Qwen/Qwen3-30B-A3B-Instruct-2507
      - --enable-auto-tool-choice
      - --tool-call-parser
      - hermes
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --max-model-len
      # - "20000"
      # - "24000"
      - "29000"
      # - "32768"
      # - "16384"
      
      # - "0.90"
      # - "0.95"
      - --max-num-seqs
      - "4"
  
    # OpenHermes 7B
    # command:
    #   - "--model"
    #   - "TheBloke/OpenHermes-2.5-Mistral-7B-AWQ"
    #   - "--served-model-name"
    #   - "teknium/OpenHermes-2.5-Mistral-7B"
    #   - "--quantization"
    #   - "awq"
    #   - "--dtype"
    #   - "half"
    #   - "--gpu-memory-utilization"
    #   - "0.8"
    #   - "--max-model-len"
    #   - "6096"
    #   - "--port"
    #   - "8000"
    #   - "--tokenizer"
    #   - "teknium/OpenHermes-2.5-Mistral-7B"

    volumes:
      # vLLM uses HF cache under /root/.cache/huggingface in the official image
      - ../data/vllm_data:/root/.cache/huggingface:cached
      - ./services/tgi/tokenizer_configs:/tokenizer_configs:ro

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              # device_ids: ['0', '1']   # to expose multiple GPUs
              device_ids: ['0']
              capabilities: [gpu]
  
  vllm-deepseek-ocr:
    image: vllm/vllm-openai:nightly
    ipc: host
    profiles: ["deepseek-ocr"]

    environment:
      # HUGGING_FACE_HUB_TOKEN: "${HUGGING_FACE_HUB_TOKEN}"
      VLLM_LOG_LEVEL: "INFO"

    # DeepSeek OCR
    # vllm serve deepseek-ai/DeepSeek-OCR --logits_processors vllm.model_executor.models.deepseek_ocr:NGramPerReqLogitsProcessor --no-enable-prefix-caching --mm-processor-cache-gb 0
    command:
      - deepseek-ai/DeepSeek-OCR-2
      - --logits_processors
      - vllm.model_executor.models.deepseek_ocr:NGramPerReqLogitsProcessor
      - --no-enable-prefix-caching
      - --mm-processor-cache-gb
      - "0"
      - --gpu-memory-utilization
      - "0.9"

    volumes:
      # vLLM uses HF cache under /root/.cache/huggingface in the official image
      - ../data/vllm_ocr_data:/root/.cache/huggingface:cached
      - ./services/tgi/tokenizer_configs:/tokenizer_configs:ro

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              # device_ids: ['0', '1']   # to expose multiple GPUs
              device_ids: ['1']
              capabilities: [gpu]

  vllm-glm-ocr:
    image: vllm/vllm-openai:nightly
    ipc: host
    profiles: ["glm-ocr"]

    environment:
      # HUGGING_FACE_HUB_TOKEN: "${HUGGING_FACE_HUB_TOKEN}"
      VLLM_LOG_LEVEL: "INFO"

    command:
      - zai-org/GLM-OCR
      - --allowed-local-media-path
      - /
      - --port
      - "8080"
      - --speculative-config
      - '{"method": "mtp", "num_speculative_tokens": 1}'
      - --served-model-name
      - glm-ocr
      - --gpu-memory-utilization
      - "0.9"
      - --no-enable-prefix-caching
      - --mm-processor-cache-gb
      - "0"
      - --max-model-len
      - "32768"
      # Sizes the multimodal encoder cache; must exceed the vision-token count
      # of the largest page image (default was 4800, dense pages hit ~5000+).
      - --max-num-batched-tokens
      - "32768"

    volumes:
      # vLLM uses HF cache under /root/.cache/huggingface in the official image
      - ../data/vllm_ocr_data:/root/.cache/huggingface:cached
      - ./services/tgi/tokenizer_configs:/tokenizer_configs:ro

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              # device_ids: ['0', '1']   # to expose multiple GPUs
              device_ids: ['1']
              capabilities: [gpu]


  open-webui:
    <<: *base-service
    image: ghcr.io/open-webui/open-webui:main
    ipc: host
    ports:
      - 3000:8080
    environment:
      - OPENAI_API_BASE_URL=http://vllm:8000/v1
      - OPENAI_API_KEYS=anything
      - WEBUI_AUTH=False
    volumes:
    - ../data/open-webui/data:/app/backend/data
    - ../data/open-webui/static:/app/backend/open_webui/static

  firebase-emulator:
    ports:
    - 4000:4000 # Firebase Emulator UI
    - 9099:9099 # Firebase Auth Emulator
    build:
      context: ./services/firebase-emulator/
    volumes:
    # Keeps emulator users across restarts. Without it every restart mints new
    # uids for the same people, which creates duplicate accounts — see the
    # Dockerfile.
    - firebase_emulator_data:/data

  postgres:
    image: pgvector/pgvector:pg18
    container_name: pgvector-db
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
    - pgdata:/var/lib/postgresql

volumes:
  claude_data:
  hindsight_data:
  codex_data:
  agents_data:
  pgdata:
  firebase_emulator_data:
