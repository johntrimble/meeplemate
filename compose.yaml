# Standard options we will include in our services.
x-base-service: &base-service
  # Include the .env file for environment variables (if it exists).
  env_file:
  - path: .env
    required: false

  # Make sure the container runs as the same user as the host to avoid
  # permission issues with mounted volumes.
  user: "${MY_UID}:${MY_GID}"

  # Docker allocates 64MB of shared memory by default. This is sometimes 
  # insufficient. Rather than mock around with settings here, we just set the
  # IPC mode to use the host. Note that this is not recommended for production
  # environments due to security concerns, but it is useful for development.
  ipc: host

services:
  dev:
    # The main development environment container.
    # Inherits common settings from the base service anchor above.
    <<: *base-service
    depends_on:
      tgi:
        condition: service_started
      cassandra:
        condition: service_healthy
      data-api:
        condition: service_healthy
    build:
      # Build context is the pytorch Dockerfile directory
      context: ./services/dev/
      additional_contexts:
        # Allows referencing the project root in the Dockerfile
        workspace: .
      args:
        # Ensure the container user matches the host user for correct file permissions.
        # These are set in the .env file, which is initialized by script/bootstrap.
        UID: ${MY_UID}
        GID: ${MY_GID}

    # Mount the project root and data directory into the container.
    # This allows code and data changes on the host to be reflected in the container.
    volumes:
    # Mount the project root as /workspace (source code, scripts, etc)
    - .:/workspace:cached
    # Persist data across container restarts (models, cache, etc)
    - ./data:/data:cached
    # Claude CLI data
    - claude_data:/home/vscode/.claude:cached

    # Set the working directory to where the workspace folder is mounted.
    working_dir: /workspace

    # Keep the container running (useful for VS Code dev containers, debugging, etc).
    command: tail -f /dev/null

    # Uncomment below to run jupyter lab on startup
    # command: jupyter lab --ip=0.0.0.0 --no-browser --NotebookApp.token='' --NotebookApp.password=''

    ports:
    - 8000:8000 # Chainlit

    # Enable GPU access for PyTorch (NVIDIA only).
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            # If you want to expose all GPUs, you can comment out the device_ids line.
            # Otherwise, specify the GPU IDs you want to use.
            # device_ids: ['0', '1']
            device_ids: ['0']
            capabilities: [gpu]

  tgi:
    image: ghcr.io/huggingface/text-generation-inference:3.3.6
    ipc: host
    ports:
    - 8080:80
    environment:
      # LOG_LEVEL: debug
      # SHARD_UDS_PATH: /data/text-generation-server
      CUDA_MEMORY_FRACTION: "0.80"
      MAX_INPUT_LENGTH: "5096"
      MAX_TOTAL_TOKENS: "6096"
      # CUDA_LAUNCH_BLOCKING: "1"

      # DISABLE_CUSTOM_KERNELS: "true"
      # CUDA_GRAPHS: "0"
      
      QUANTIZE: "awq"
      MODEL_ID: "TheBloke/OpenHermes-2.5-Mistral-7B-AWQ"
      TOKENIZER_CONFIG_PATH: "/tokenizer_configs/OpenHermes-2.5-Mistral-7B.json"

      # QUANTIZE: "awq"
      # MODEL_ID: "TheBloke/Nous-Hermes-2-SOLAR-10.7B-AWQ"
      # TOKENIZER_CONFIG_PATH: "/tokenizer_configs/Nous-Hermes-2-SOLAR-10.7B.json"

      # QUANTIZE: "bitsandbytes-nf4"
      # MODEL_ID: "teknium/OpenHermes-2.5-Mistral-7B"
      # TOKENIZER_CONFIG_PATH: "/tokenizer_configs/OpenHermes-2.5-Mistral-7B.json"

      # QUANTIZE: "awq"
      # MODEL_ID: "hugging-quants/gemma-2-9b-it-AWQ-INT4"

    volumes:
    - ./data/tgi_data:/data:cached
    # mount services/tgi/tokenizer_configs as read-only to /tokenizer_configs
    - ./services/tgi/tokenizer_configs:/tokenizer_configs:ro
  
    # Attach the GPU to the container. Use nvidia-smi to verify the GPU
    # actually got attached. If at any point nvidia-smi throws an error, try
    # rebuilding the devcontainer in vs code.
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            # If you want to expose all GPUs, you can comment out the device_ids line.
            # Otherwise, specify the GPU IDs you want to use.
            # device_ids: ['0', '1']
            device_ids: ['1']
            capabilities: [gpu]
  
  tgi2:
    image: ghcr.io/huggingface/text-generation-inference:3.3.4
    ipc: host
    ports:
    - 8081:80
    environment:
      CUDA_MEMORY_FRACTION: "0.80"
      MAX_INPUT_LENGTH: "4096"
      MAX_TOTAL_TOKENS: "6096"

      # QUANTIZE: "awq"
      # MODEL_ID: "TheBloke/OpenHermes-2.5-Mistral-7B-AWQ"
      # TOKENIZER_CONFIG_PATH: "/tokenizer_configs/OpenHermes-2.5-Mistral-7B.json"

      # QUANTIZE: "awq"
      # MODEL_ID: "TheBloke/Nous-Hermes-2-SOLAR-10.7B-AWQ"
      # TOKENIZER_CONFIG_PATH: "/tokenizer_configs/Nous-Hermes-2-SOLAR-10.7B.json"

      # QUANTIZE: "bitsandbytes-nf4"
      # MODEL_ID: "teknium/OpenHermes-2.5-Mistral-7B"
      # TOKENIZER_CONFIG_PATH: "/tokenizer_configs/OpenHermes-2.5-Mistral-7B.json"

      QUANTIZE: "awq"
      MODEL_ID: "hugging-quants/gemma-2-9b-it-AWQ-INT4"

    volumes:
    - ./data/tgi_data2:/data:cached
    # Attach the GPU to the container. Use nvidia-smi to verify the GPU
    # actually got attached. If at any point nvidia-smi throws an error, try
    # rebuilding the devcontainer in vs code.
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            # If you want to expose all GPUs, you can comment out the device_ids line.
            # Otherwise, specify the GPU IDs you want to use.
            # device_ids: ['0', '1']
            device_ids: ['0']
            capabilities: [gpu]

  # Single node Cassandra cluster
  # cassandra:
  #   image: cassandra:5.0
  #   environment:
  #     # Configure a single-node cluster
  #     - CASSANDRA_CLUSTER_NAME=PythonCassandraCluster
  #     - CASSANDRA_DC=datacenter1
  #     - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
  #     # For development, we can reduce memory usage
  #     - MAX_HEAP_SIZE=512M
  #     - HEAP_NEWSIZE=100M
  #   volumes:
  #     # Persist Cassandra data
  #     - cassandra_data:/var/lib/cassandra
  #   healthcheck:
  #     # Use cqlsh to check if Cassandra is ready to accept connections
  #     test: ["CMD-SHELL", "cqlsh -e 'describe cluster' || exit 1"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 30
  #     start_period: 60s

  cassandra:
    image: cr.dtsx.io/datastax/dse-server:6.9.15
    platform: linux/amd64
    mem_limit: 2500M
    environment:
      - MAX_HEAP_SIZE=512M
      - HEAP_NEWSIZE=100M
      - CLUSTER_NAME=dse-cluster
      - DC=datacenter1
      - DS_LICENSE=accept
      - SNITCH=GossipingPropertyFileSnitch
      - USE_BETA=true
    volumes:
    - cassandra_data:/var/lib/cassandra
    healthcheck:
      # Use cqlsh to check if Cassandra is ready to accept connections
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s


  data-api:
    image: stargateio/data-api:v1
    depends_on:
      cassandra:
        condition: service_healthy
    mem_limit: 2G
    environment:
      - JAVA_MAX_MEM_RATIO=75
      - JAVA_INITIAL_MEM_RATIO=50
      - GC_CONTAINER_OPTIONS=-XX:+UseG1GC
      - STARGATE_JSONAPI_OPERATIONS_DATABASE_CONFIG_CASSANDRA_END_POINTS=cassandra
      - STARGATE_JSONAPI_OPERATIONS_DATABASE_CONFIG_LOCAL_DATACENTER=datacenter1
      - QUARKUS_HTTP_ACCESS_LOG_ENABLED=true
      - QUARKUS_LOG_LEVEL=INFO
      - STARGATE_JSONAPI_OPERATIONS_VECTORIZE_ENABLED=true
      - JAVA_OPTS_APPEND=-Dquarkus.http.host=0.0.0.0 -Djava.util.logging.manager=org.jboss.logmanager.LogManager
    ports:
      - 8181:8181
    healthcheck:
      test: curl -f http://localhost:8181/stargate/health || exit 1
      interval: 5s
      timeout: 10s
      retries: 10

volumes:
  claude_data:
  cassandra_data:
