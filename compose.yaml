# Standard options we will include in our services.
x-base-service: &base-service
  # Include the .env file for environment variables (if it exists).
  env_file:
  - path: .env
    required: false

  # Make sure the container runs as the same user as the host to avoid
  # permission issues with mounted volumes.
  user: "${MY_UID}:${MY_GID}"

  # Docker allocates 64MB of shared memory by default. This is sometimes 
  # insufficient. Rather than mock around with settings here, we just set the
  # IPC mode to use the host. Note that this is not recommended for production
  # environments due to security concerns, but it is useful for development.
  ipc: host

services:
  caddy-auth:
    image: caddy:2
    profiles: ["public-share"]
    network_mode: service:ts-meeplemate
    depends_on:
      - ts-meeplemate
      - dev
    env_file:
    - path: .env
      required: false
    environment:
    - DEMO_TOKEN=${DEMO_TOKEN}
    - DEMO_COOKIE=${DEMO_COOKIE}
    volumes:
      - ./services/caddy-auth/Caddyfile:/etc/caddy/Caddyfile:ro

  ts-meeplemate:
    ports:
    - 8000:8000 # Chainlit
    hostname: ts-meeplemate
    env_file:
    - path: .env
      required: false
    image: tailscale/tailscale:latest
    environment:
    # TS_AUTH_KEY is set in the .env file
    - TS_EXTRA_ARGS=--advertise-tags=tag:dev-meeplemate
    - TS_STATE_DIR=/var/lib/tailscale
    volumes:
    - tailscale-data-meeplemate:/var/lib/tailscale
    devices:
    - /dev/net/tun:/dev/net/tun
    cap_add:
    - net_admin
    - sys_module
  
  dev:
    # The main development environment container.
    # Inherits common settings from the base service anchor above.
    <<: *base-service
    depends_on:
      tei:
        condition: service_started
      vllm:
        condition: service_started
      cassandra:
        condition: service_healthy
      dse:
        condition: service_healthy
      data-api:
        condition: service_healthy
    build:
      # Build context is the pytorch Dockerfile directory
      context: ./services/dev/
      additional_contexts:
        # Allows referencing the project root in the Dockerfile
        workspace: .
      args:
        # Ensure the container user matches the host user for correct file permissions.
        # These are set in the .env file, which is initialized by script/bootstrap.
        UID: ${MY_UID}
        GID: ${MY_GID}

    # Mount the project root and data directory into the container.
    # This allows code and data changes on the host to be reflected in the container.
    volumes:
    # Mount the project root as /workspace (source code, scripts, etc)
    - .:/workspace:cached
    # Persist data across container restarts (models, cache, etc)
    - ./data:/data:cached
    # Claude CLI data
    - claude_data:/home/vscode/.claude:cached

    # Set the working directory to where the workspace folder is mounted.
    working_dir: /workspace

    # Keep the container running (useful for VS Code dev containers, debugging, etc).
    command: tail -f /dev/null
    network_mode: service:ts-meeplemate

    # # Enable GPU access for PyTorch (NVIDIA only).
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #       - driver: nvidia
    #         # If you want to expose all GPUs, you can comment out the device_ids line.
    #         # Otherwise, specify the GPU IDs you want to use.
    #         # device_ids: ['0', '1']
    #         device_ids: ['0']
    #         capabilities: [gpu]

  vllm:
    image: vllm/vllm-openai:v0.13.0
    ipc: host

    environment:
      GPU_MEMORY_UTILIZATION: 0.95
      VLLM_LOG_LEVEL: "INFO"
      # VLLM_NVFP4_GEMM_BACKEND: "cutlass"

    # Qwen 3 32B
    command:
      - --model
      # - RedHatAI/Qwen3-32B-NVFP4A16
      # - RedHatAI/Qwen3-32B-NVFP4
      - NVFP4/Qwen3-30B-A3B-Instruct-2507-FP4
      # - NVFP4/Qwen3-Coder-30B-A3B-Instruct-FP4
      - "--served-model-name"
      # - "Qwen/Qwen3-Coder-30B-A3B-Instruct"
      # - "Qwen/Qwen3-32B"
      - Qwen/Qwen3-30B-A3B-Instruct-2507
      - --enable-auto-tool-choice
      - --tool-call-parser
      - hermes
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --max-model-len
      # - "20000"
      # - "24000"
      - "29000"
      # - "32768"
      # - "16384"
      
      # - "0.90"
      # - "0.95"
      - --max-num-seqs
      - "4"
  
    # OpenHermes 7B
    # command:
    #   - "--model"
    #   - "TheBloke/OpenHermes-2.5-Mistral-7B-AWQ"
    #   - "--served-model-name"
    #   - "teknium/OpenHermes-2.5-Mistral-7B"
    #   - "--quantization"
    #   - "awq"
    #   - "--dtype"
    #   - "half"
    #   - "--gpu-memory-utilization"
    #   - "0.8"
    #   - "--max-model-len"
    #   - "6096"
    #   - "--port"
    #   - "8000"
    #   - "--tokenizer"
    #   - "teknium/OpenHermes-2.5-Mistral-7B"

    volumes:
      # vLLM uses HF cache under /root/.cache/huggingface in the official image
      - ./data/vllm_data:/root/.cache/huggingface:cached
      - ./services/tgi/tokenizer_configs:/tokenizer_configs:ro

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              # device_ids: ['0', '1']   # to expose multiple GPUs
              device_ids: ['0']
              capabilities: [gpu]
  
  vllm-deepseek-ocr:
    image: vllm/vllm-openai:nightly
    ipc: host
    profiles: ["deepseek-ocr"]

    environment:
      # HUGGING_FACE_HUB_TOKEN: "${HUGGING_FACE_HUB_TOKEN}"
      VLLM_LOG_LEVEL: "INFO"

    # DeepSeek OCR
    # vllm serve deepseek-ai/DeepSeek-OCR --logits_processors vllm.model_executor.models.deepseek_ocr:NGramPerReqLogitsProcessor --no-enable-prefix-caching --mm-processor-cache-gb 0
    command:
      - deepseek-ai/DeepSeek-OCR-2
      - --logits_processors
      - vllm.model_executor.models.deepseek_ocr:NGramPerReqLogitsProcessor
      - --no-enable-prefix-caching
      - --mm-processor-cache-gb
      - "0"
      - --gpu-memory-utilization
      - "0.9"

    volumes:
      # vLLM uses HF cache under /root/.cache/huggingface in the official image
      - ./data/vllm_ocr_data:/root/.cache/huggingface:cached
      - ./services/tgi/tokenizer_configs:/tokenizer_configs:ro

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              # device_ids: ['0', '1']   # to expose multiple GPUs
              device_ids: ['1']
              capabilities: [gpu]

  vllm-glm-ocr:
    image: vllm/vllm-openai:nightly
    ipc: host
    profiles: ["glm-ocr"]

    environment:
      # HUGGING_FACE_HUB_TOKEN: "${HUGGING_FACE_HUB_TOKEN}"
      VLLM_LOG_LEVEL: "INFO"

    command:
      - zai-org/GLM-OCR
      - --allowed-local-media-path
      - /
      - --port
      - "8080"
      - --speculative-config
      - '{"method": "mtp", "num_speculative_tokens": 1}'
      - --served-model-name
      - glm-ocr
      - --gpu-memory-utilization
      - "0.9"
      - --no-enable-prefix-caching
      - --mm-processor-cache-gb
      - "0"
 
    volumes:
      # vLLM uses HF cache under /root/.cache/huggingface in the official image
      - ./data/vllm_ocr_data:/root/.cache/huggingface:cached
      - ./services/tgi/tokenizer_configs:/tokenizer_configs:ro

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              # device_ids: ['0', '1']   # to expose multiple GPUs
              device_ids: ['1']
              capabilities: [gpu]


  open-webui:
    <<: *base-service
    image: ghcr.io/open-webui/open-webui:main
    ipc: host
    ports:
      - 3000:8080
    environment:
      - OPENAI_API_BASE_URL=http://vllm:8000/v1
      - OPENAI_API_KEYS=anything
      - WEBUI_AUTH=False
    volumes:
    - ./data/open-webui/data:/app/backend/data
    - ./data/open-webui/static:/app/backend/open_webui/static


  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    # CPU only: no GPU devices, no --gpus flag
    ipc: host

    # If the Jina model is gated/private, add HF_TOKEN here
    environment: {}
      # HF_TOKEN: "${HUGGINGFACE_HUB_TOKEN}"
      # Optional: tweak TEI batch behavior via CLI flags instead of env

    # TEI is configured via CLI args, like TGI/vLLM
    command:
      - --max-concurrent-requests
      - "2"
      - "--model-id"
      - "jinaai/jina-embeddings-v2-base-en"
      - "--pooling"
      - "mean"

    volumes:
      # Cache model weights so they aren't re-downloaded each start
      - ./data/tei_data:/data:cached

  # tgi2:
  #   image: ghcr.io/huggingface/text-generation-inference:3.3.4
  #   ipc: host
  #   ports:
  #   - 8081:80
  #   environment:
  #     CUDA_MEMORY_FRACTION: "0.80"
  #     MAX_INPUT_LENGTH: "4096"
  #     MAX_TOTAL_TOKENS: "6096"

  #     # QUANTIZE: "awq"
  #     # MODEL_ID: "TheBloke/OpenHermes-2.5-Mistral-7B-AWQ"
  #     # TOKENIZER_CONFIG_PATH: "/tokenizer_configs/OpenHermes-2.5-Mistral-7B.json"

  #     # QUANTIZE: "awq"
  #     # MODEL_ID: "TheBloke/Nous-Hermes-2-SOLAR-10.7B-AWQ"
  #     # TOKENIZER_CONFIG_PATH: "/tokenizer_configs/Nous-Hermes-2-SOLAR-10.7B.json"

  #     # QUANTIZE: "bitsandbytes-nf4"
  #     # MODEL_ID: "teknium/OpenHermes-2.5-Mistral-7B"
  #     # TOKENIZER_CONFIG_PATH: "/tokenizer_configs/OpenHermes-2.5-Mistral-7B.json"

  #     QUANTIZE: "awq"
  #     MODEL_ID: "hugging-quants/gemma-2-9b-it-AWQ-INT4"

  #   volumes:
  #   - ./data/tgi_data2:/data:cached
  #   # Attach the GPU to the container. Use nvidia-smi to verify the GPU
  #   # actually got attached. If at any point nvidia-smi throws an error, try
  #   # rebuilding the devcontainer in vs code.
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #         - driver: nvidia
  #           # If you want to expose all GPUs, you can comment out the device_ids line.
  #           # Otherwise, specify the GPU IDs you want to use.
  #           # device_ids: ['0', '1']
  #           device_ids: ['0']
  #           capabilities: [gpu]

  postgres:
    image: pgvector/pgvector:pg18
    container_name: pgvector-db
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
    - pgdata:/var/lib/postgresql


  # Single node Cassandra cluster
  cassandra:
    image: cassandra:5.0
    environment:
      # Configure a single-node cluster
      - CASSANDRA_CLUSTER_NAME=PythonCassandraCluster
      - CASSANDRA_DC=datacenter1
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      # For development, we can reduce memory usage
      - MAX_HEAP_SIZE=512M
      - HEAP_NEWSIZE=100M
    volumes:
      # Persist Cassandra data
      - cassandra_data:/var/lib/cassandra
    healthcheck:
      # Use cqlsh to check if Cassandra is ready to accept connections
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  dse:
    image: cr.dtsx.io/datastax/dse-server:6.9.15
    platform: linux/amd64
    mem_limit: 16G
    environment:
      - MAX_HEAP_SIZE=8G
      - HEAP_NEWSIZE=100M
      - CLUSTER_NAME=dse-cluster
      - DC=datacenter1
      - DS_LICENSE=accept
      - SNITCH=GossipingPropertyFileSnitch
      - USE_BETA=true
    volumes:
    - dse_data:/var/lib/cassandra
    healthcheck:
      # Use cqlsh to check if Cassandra is ready to accept connections
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  data-api:
    image: stargateio/data-api:v1
    depends_on:
      cassandra:
        condition: service_healthy
    mem_limit: 2G
    environment:
      - JAVA_MAX_MEM_RATIO=75
      - JAVA_INITIAL_MEM_RATIO=50
      - GC_CONTAINER_OPTIONS=-XX:+UseG1GC
      - STARGATE_JSONAPI_OPERATIONS_DATABASE_CONFIG_CASSANDRA_END_POINTS=dse
      - STARGATE_JSONAPI_OPERATIONS_DATABASE_CONFIG_LOCAL_DATACENTER=datacenter1
      - QUARKUS_HTTP_ACCESS_LOG_ENABLED=true
      - QUARKUS_LOG_LEVEL=INFO
      - STARGATE_JSONAPI_OPERATIONS_VECTORIZE_ENABLED=true
      - JAVA_OPTS_APPEND=-Dquarkus.http.host=0.0.0.0 -Djava.util.logging.manager=org.jboss.logmanager.LogManager
    ports:
      - 8181:8181
    healthcheck:
      test: curl -f http://localhost:8181/stargate/health || exit 1
      interval: 5s
      timeout: 10s
      retries: 10

volumes:
  claude_data:
  cassandra_data:
  dse_data:
  tailscale-data-meeplemate:
  pgdata:
