name: Build API Image

on:
  push:
    branches:
    - dev
    - main
    - "25-add-api-image"
    paths:
      - "docker/Dockerfile.api"
      - "meeplemate/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/build-api.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      short_sha: ${{ steps.sha.outputs.short }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: johntrimble
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            johntrimble/meeplemate-api
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/dev' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

  memory-test:
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      packages: read

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image
        run: docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ needs.build-and-push.outputs.short_sha }}

      - name: Run alembic migrations
        run: |
          docker run --rm --network host \
            -e MM_PG__URL=postgresql+asyncpg://postgres:password@localhost:5432/postgres \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ needs.build-and-push.outputs.short_sha }} \
            alembic upgrade head

      - name: Start API and check memory
        run: |
          IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ needs.build-and-push.outputs.short_sha }}
          docker run -d --name api-test --network host \
            -e MM_AUTH_BYPASS=true \
            -e MM_PG__URL=postgresql+asyncpg://postgres:password@localhost:5432/postgres \
            -e MM_CHAT__ENDPOINT=http://localhost:9999/v1 \
            -e MM_CHAT__ENDPOINT_TYPE=openai \
            -e MM_CHAT__MODEL_NAME=dummy \
            -e MM_MODEL_NAME=dummy \
            -e MM_EMBEDDING__MODEL=BAAI/bge-small-en-v1.5 \
            -e MM_EMBEDDING__API_KEY=dummy \
            "$IMAGE"

          echo "Waiting for startup..."
          for i in $(seq 1 60); do
            docker logs api-test 2>&1 | grep -q "Application startup complete" && break
            sleep 1
          done

          docker logs api-test 2>&1 | grep -q "Application startup complete" \
            || { echo "ERROR: API did not start within 60s"; docker logs api-test; exit 1; }

          MEM_BYTES=$(docker stats --no-stream --format "{{.MemUsage}}" api-test \
            | awk '{print $1}' | numfmt --from=iec)
          MEM_MB=$(( MEM_BYTES / 1024 / 1024 ))
          echo "Container memory: ${MEM_MB} MB"

          LIMIT=400
          if [ "$MEM_MB" -gt "$LIMIT" ]; then
            echo "FAIL: ${MEM_MB} MB exceeds limit of ${LIMIT} MB"
            docker logs api-test
            exit 1
          fi
          echo "PASS: ${MEM_MB} MB is within limit of ${LIMIT} MB"
