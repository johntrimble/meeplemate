name: Build API Image

on:
  push:
    branches:
    - dev
    - main
    - "30-cors-api"
    paths:
      - "docker/**"
      - "meeplemate/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/build-api.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/api

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: johntrimble
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            johntrimble/meeplemate-api
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/dev' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (local)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.api
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Run alembic migrations
        run: |
          docker run --rm --network host \
            -e MM_PG__URL=postgresql+asyncpg://postgres:password@localhost:5432/postgres \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-$(git rev-parse --short HEAD) \
            alembic upgrade head

      - name: Memory test
        run: |
          IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-$(git rev-parse --short HEAD)
          docker run -d --name api-test --network host \
            -e MM_AUTH_BYPASS=true \
            -e MM_PG__URL=postgresql+asyncpg://postgres:password@localhost:5432/postgres \
            -e MM_CHAT__MODELS='[{"model_name":"dummy","endpoint_type":"openai","endpoint":"http://localhost:9999/v1"}]' \
            -e MM_MODEL_NAME=dummy \
            -e MM_EMBEDDING__MODEL=BAAI/bge-small-en-v1.5 \
            -e MM_EMBEDDING__API_KEY=dummy \
            "$IMAGE"

          echo "Waiting for startup..."
          for i in $(seq 1 60); do
            docker logs api-test 2>&1 | grep -q "Application startup complete" && break
            sleep 1
          done

          docker logs api-test 2>&1 | grep -q "Application startup complete" \
            || { echo "ERROR: API did not start within 60s"; docker logs api-test; exit 1; }

          MEM_MB=$(docker stats --no-stream --format "{{.MemUsage}}" api-test \
            | awk '{
                v=$1
                if (sub(/GiB$/, "", v)) v = int(v * 1024)
                else if (sub(/MiB$/, "", v)) v = int(v)
                else if (sub(/kB$/, "", v)) v = int(v / 1024)
                print int(v)
              }')
          echo "Container memory: ${MEM_MB} MB"

          LIMIT=400
          if [ "$MEM_MB" -gt "$LIMIT" ]; then
            echo "FAIL: ${MEM_MB} MB exceeds limit of ${LIMIT} MB"
            docker logs api-test
            exit 1
          fi
          echo "PASS: ${MEM_MB} MB is within limit of ${LIMIT} MB"

      - name: Sops entrypoint test
        run: |
          IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-$(git rev-parse --short HEAD)
          docker rm -f api-test >/dev/null 2>&1 || true

          sudo apt-get install -y --no-install-recommends age >/dev/null
          WORK=$(mktemp -d)
          age-keygen -o "$WORK/key.txt" 2>/dev/null
          AGE_PUBLIC=$(age-keygen -y "$WORK/key.txt")
          AGE_SECRET=$(grep '^AGE-SECRET-KEY-' "$WORK/key.txt")

          # The same config as the memory test, but only in the encrypted file.
          cat > "$WORK/plain.env" <<'ENV'
          MM_AUTH_BYPASS=true
          MM_PG__URL=postgresql+asyncpg://postgres:password@localhost:5432/postgres
          MM_CHAT__MODELS=[{"model_name":"dummy","endpoint_type":"openai","endpoint":"http://localhost:9999/v1"}]
          MM_MODEL_NAME=dummy
          MM_EMBEDDING__MODEL=BAAI/bge-small-en-v1.5
          MM_EMBEDDING__API_KEY=dummy
          ENV
          docker run --rm -v "$WORK:/work" -w /work --entrypoint sops "$IMAGE" \
            encrypt --age "$AGE_PUBLIC" --output encrypted.env plain.env
          ENCRYPTED=$(cat "$WORK/encrypted.env")

          echo "--- decrypts into the server's environment"
          docker run -d --name api-sops-test --network host \
            -e MEEPLEMATE_SOPS_ENV="$ENCRYPTED" \
            -e SOPS_AGE_KEY="$AGE_SECRET" \
            "$IMAGE"
          for i in $(seq 1 60); do
            docker logs api-sops-test 2>&1 | grep -q "Application startup complete" && break
            sleep 1
          done
          docker logs api-sops-test 2>&1 | grep -q "Application startup complete" \
            || { echo "FAIL: API did not start from the encrypted config"; docker logs api-sops-test; exit 1; }
          docker exec api-sops-test python -c '
          env = dict(e.split("=", 1) for e in open("/proc/1/environ").read().split("\0") if e)
          cmd = open("/proc/1/cmdline").read().split("\0")
          # uvicorn is a script, so PID 1 is `python /opt/venv/bin/uvicorn ...`, not `sh -c`.
          assert cmd[1].rsplit("/", 1)[-1] == "uvicorn", f"PID 1 is {cmd}, not uvicorn"
          assert env.get("MM_MODEL_NAME") == "dummy", "MM_MODEL_NAME not decrypted"
          assert "MEEPLEMATE_SOPS_ENV" not in env, "ciphertext leaked into server env"
          print("PASS: uvicorn is PID 1 with decrypted MM_* values")'
          docker rm -f api-sops-test >/dev/null

          expect_no_start() {
            local name=$1; shift
            set +e
            OUTPUT=$(timeout 60 docker run --rm "$@" "$IMAGE" 2>&1)
            STATUS=$?
            set -e
            if [ "$STATUS" -eq 0 ] || [ "$STATUS" -eq 124 ] || echo "$OUTPUT" | grep -q "Started server process"; then
              echo "FAIL: $name: exit $STATUS"; echo "$OUTPUT"; exit 1
            fi
            echo "PASS: $name: exited $STATUS before uvicorn started"
          }
          echo "--- refuses to start without its credentials"
          expect_no_start "corrupt value" -e MEEPLEMATE_SOPS_ENV="not a sops file" -e SOPS_AGE_KEY="$AGE_SECRET"
          expect_no_start "no usable key" -e MEEPLEMATE_SOPS_ENV="$ENCRYPTED"

      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.api
          load: false
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
