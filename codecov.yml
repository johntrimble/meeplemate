# Codecov configuration.
# Coverage is reported for the Python backend (the `meeplemate` package);
# see .github/workflows/test-backend.yml for the upload step.
coverage:
  status:
    project:
      default:
        # Report coverage changes without failing the PR while the baseline
        # is still being established.
        informational: true
    patch:
      default:
        informational: true

# Do not post coverage comments on pull requests. Coverage is still uploaded
# and visible in the Codecov UI and in the commit status checks.
comment: false
