# Development Configuration for MeepleMate
# This file contains non-secret configuration for local development.
# Secrets should be defined in environment variables (see .env file).

# Primary model name used for tokenizer and other purposes
# model_name: "Qwen/Qwen3-32B"
model_name: "Qwen/Qwen3-30B-A3B-Instruct-2507"
# model_name: "NVFP4/Qwen3-Coder-30B-A3B-Instruct-FP4"
# model_name: "Qwen/Qwen3-Coder-30B-A3B-Instruct"

pg:
  url: "postgresql+asyncpg://postgres:password@postgres:5432/postgres"
  pool_size: 10
  max_overflow: 20

# Chat/LLM Service Configuration
chat:
  # model_name: "Qwen/Qwen3-32B"
  model_name: "Qwen/Qwen3-30B-A3B-Instruct-2507"
  # model_name: "NVFP4/Qwen3-Coder-30B-A3B-Instruct-FP4"
  # model_name: "Qwen/Qwen3-Coder-30B-A3B-Instruct"
  endpoint_type: "openai"
  endpoint: "http://vllm:8000/v1"
  # endpoint: http://192.168.0.44:8000/v1
  max_new_tokens: 3072
  timeout: 900
  explicit_disable_thinking: true

  # Sampling config
  temperature: 0.7
  top_p: 1.0 # was 0.8
  top_k: -1
  min_p: 0.10
  presence_penalty: 1.2 # was 1.6
  frequency_penalty: 0.2
  repetition_penalty: 1.0

# Embedding Service Configuration
embedding:
  model: "BAAI/bge-small-en-v1.5"
  # endpoint: "http://tei:80/v1"
  query_instruction: "Represent this sentence for searching relevant passages: "

# Tokenizer
# use_lightweight_tokenizer: true
# use_approximate_tokenizer: true

# Application Settings
rules_path: "./data/rules/munchkin_rules/"
load_docs: false

# QA Chain Configuration
qa_chain_config:
  reword_documents: true
  self_consistency: true
  thread_of_thought: true
  consistency_kwargs:
    samples: 3
